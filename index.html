<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dino Runner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">
<style>
  :root {
    --bg: #f7f7f7;
    --fg: #535353;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    transition: background .8s;
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 10px;
  }
  #stage {
    position: relative;
    width: 100%;
    max-width: 900px;
  }
  canvas {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    cursor: pointer;
  }
  #hint {
    color: var(--fg);
    opacity: .55;
    font-size: 13px;
    letter-spacing: 1px;
    text-align: center;
    transition: color .8s;
  }
  /* ---------- overlays ---------- */
  .panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--fg);
    transition: color .8s;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s, color .8s;
  }
  .panel.show { opacity: 1; pointer-events: auto; }
  .panel h1 {
    font-size: clamp(20px, 4.5vw, 34px);
    letter-spacing: 6px;
    font-weight: bold;
  }
  .panel .sub { font-size: 14px; letter-spacing: 2px; opacity: .8; }
  .panel button {
    margin-top: 6px;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 2px;
    padding: 10px 26px;
    background: transparent;
    color: inherit;
    border: 2px solid currentColor;
    border-radius: 6px;
    cursor: pointer;
  }
  .panel button:hover { background: rgba(128,128,128,.15); }
  #btnMute {
    position: absolute;
    top: 8px; left: 8px;
    width: 34px; height: 34px;
    font-size: 17px;
    line-height: 1;
    background: transparent;
    border: none;
    color: var(--fg);
    opacity: .45;
    cursor: pointer;
    transition: color .8s;
    z-index: 5;
  }
  #btnMute:hover { opacity: .9; }
  .newRecord {
    font-size: 13px;
    letter-spacing: 3px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="btnMute" title="Звук (M)">🔊</button>
    <div class="panel" id="panelOver">
      <h1>G A M E&nbsp;&nbsp;O V E R</h1>
      <div class="sub" id="overScore"></div>
      <div class="newRecord" id="overRecord" style="display:none">★ НОВЫЙ РЕКОРД ★</div>
      <button id="btnRestart">ЕЩЁ РАЗ</button>
    </div>
    <div class="panel" id="panelPause">
      <h1>ПАУЗА</h1>
      <div class="sub">P — продолжить</div>
    </div>
  </div>
  <div id="hint">SPACE / ↑ / тап — прыжок&nbsp;&nbsp;·&nbsp;&nbsp;↓ — присесть&nbsp;&nbsp;·&nbsp;&nbsp;P — пауза</div>
</div>

<script>
"use strict";
/* ============================================================
   Dino Runner — HTML5 версия.
   Один файл, без зависимостей. Хранение рекорда абстрагировано
   (storage.*) — для YouTube Playables достаточно заменить его
   на ytgame.game.saveData/loadData и добавить их SDK-скрипт.
   ============================================================ */

const W = 900, H = 300, GROUND = 252;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");

/* ---------- responsive canvas ---------- */
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cv.style.height = "auto";
  ctx.imageSmoothingEnabled = false;
}
fit();
addEventListener("resize", fit);

/* ---------- storage (замените на ytgame SDK для Playables) ---------- */
const storage = {
  load() { try { return +localStorage.getItem("dino_hi") || 0; } catch { return 0; } },
  save(v) { try { localStorage.setItem("dino_hi", v); } catch {} },
  loadMute() { try { return localStorage.getItem("dino_mute") === "1"; } catch { return false; } },
  saveMute(v) { try { localStorage.setItem("dino_mute", v ? "1" : "0"); } catch {} },
};

/* ---------- audio (WebAudio, без файлов) ---------- */
const sound = {
  ctx: null,
  muted: storage.loadMute(),
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  beep(freq, dur, type = "square", vol = 0.06, slideTo = null) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  },
  jump() { this.beep(460, 0.1, "square", 0.05, 660); },
  milestone() { this.beep(660, 0.08); setTimeout(() => this.beep(880, 0.1), 90); },
  hit() { this.beep(160, 0.28, "sawtooth", 0.08, 60); },
};

/* ---------- пиксель-арт спрайты ---------- */
/* 'X' — тело; colorize() раскладывает на тона:
   1 основной, 2 тёмный (спина), 3 светлый (живот), o белок глаза, p зрачок */
const DINO_BODY_RAW = [
  ".............XXXXXXX",
  ".............XopXXXX",
  ".............XXXXXXX",
  ".............XXXXXXX",
  ".............XXXX...",
  ".............XXXXX..",
  "............XXXX....",
  "...........XXXX....." ,
  "X.........XXXXX.....",
  "XX........XXXXXX....",
  "XXX......XXXXXXX....",
  "XXXX....XXXXXXXXXX..",
  ".XXXXXXXXXXXXXXX....",
  "..XXXXXXXXXXXXXX....",
  "...XXXXXXXXXXXXX....",
  "....XXXXXXXXXXX.....",
  ".....XXXXXXXXXX.....",
  "......XXXXXXXX......",
];
const LEGS_RUN_A = [
  ".......XX...XX......",
  ".......XX...........",
  ".......XXX..........",
];
const LEGS_RUN_B = [
  ".......XX...XX......",
  "............XX......",
  "............XXX.....",
];
const LEGS_STAND = [
  ".......XX...XX......",
  ".......XX...XX......",
  ".......XXX..XXX.....",
];
const DINO_DUCK_RAW = [
  [
    "...................XXXXXXX",
    "XX.................XopXXXX",
    "XXX......XXXXXXXXXXXXXXXXX",
    ".XXXXXXXXXXXXXXXXXXXXXX...",
    "..XXXXXXXXXXXXXXXXXXX.....",
    "....XXXXXXXXXXXXXXX.......",
    "......XX....XX............",
    "......XXX...................",
  ],
  [
    "...................XXXXXXX",
    "XX.................XopXXXX",
    "XXX......XXXXXXXXXXXXXXXXX",
    ".XXXXXXXXXXXXXXXXXXXXXX...",
    "..XXXXXXXXXXXXXXXXXXX.....",
    "....XXXXXXXXXXXXXXX.......",
    "......XX....XX............",
    ".............XXX..........",
  ],
];
/* птеродактиль летит влево: клюв 4, тёмное крыло 2 */
const PTERO_FRAMES = [
  [
    "..........222.....",
    "..........2222....",
    "..........22222...",
    "....111111122.....",
    "4411p111111111111.",
    ".411111111111111..",
    "...111111111......",
    "..................",
    "..................",
  ],
  [
    "..................",
    "..................",
    "..................",
    "....111111........",
    "4411p111111111111.",
    ".411111111111111..",
    "...11111112222....",
    "..........2222....",
    "..........222.....",
  ],
];

/* авто-раскраска силуэта: верх колонок темнее (спина), зона живота светлее */
function colorize(raw, belly, dark = true) {
  const rows = raw.map((r) => r.split(""));
  const width = Math.max(...raw.map((r) => r.length));
  if (dark) {
    for (let c = 0; c < width; c++) {
      let cnt = 0;
      for (let r = 0; r < rows.length && cnt < 1; r++) {
        const ch = rows[r][c];
        if (ch === "X") { rows[r][c] = "2"; cnt++; }
        else if (ch === "o" || ch === "p") break;
      }
    }
  }
  if (belly) {
    const [r1, r2, c1, c2] = belly;
    for (let r = r1; r <= r2; r++)
      for (let c = c1; c <= c2; c++)
        if (rows[r] && rows[r][c] === "X") rows[r][c] = "3";
  }
  return rows.map((r) => r.join("").replace(/X/g, "1"));
}
const DINO_BODY = colorize(DINO_BODY_RAW, [12, 16, 8, 15]);
const DINO_DUCK = DINO_DUCK_RAW.map((m) => colorize(m, [3, 5, 6, 18]));
const LEGS = {
  runA: colorize(LEGS_RUN_A, null, false),
  runB: colorize(LEGS_RUN_B, null, false),
  stand: colorize(LEGS_STAND, null, false),
};

const PAL_DINO = { 1: "#609552", 2: "#476f3c", 3: "#9dc17c", o: "#ffffff", p: "#222222" };
const PAL_PTERO = { 1: "#927460", 2: "#685042", 4: "#d4a048", p: "#222222" };

const PX = 2.4; // масштаб пикселя спрайта
function drawSprite(map, x, y, pal, scale = PX) {
  for (let r = 0; r < map.length; r++) {
    const row = map[r];
    for (let c = 0; c < row.length; c++) {
      const col = pal[row[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(x + c * scale), Math.round(y + r * scale), Math.ceil(scale), Math.ceil(scale));
    }
  }
}

/* ---------- состояние игры ---------- */
const G = {
  state: "idle", // idle | run | over | pause
  score: 0,
  hi: storage.load(),
  speed: 6,
  t: 0,             // общее время (мс) текущего забега
  nightAmount: 0,   // 0 = день, 1 = ночь (плавно)
  cycleTimer: 0,
  isNight: false,
  shake: 0,
  milestoneFlash: 0,
  newRecord: false,
};

const dino = {
  x: 70, y: GROUND,
  vy: 0,
  jumping: false,
  ducking: false,
  frame: 0,
  animT: 0,
  get w() { return this.ducking ? 26 * PX : 20 * PX; },
  get h() { return this.ducking ? 8 * PX : 21 * PX; },
  jump() {
    if (!this.jumping) {
      this.vy = -15;
      this.jumping = true;
      this.ducking = false;
      sound.jump();
    }
  },
  cutJump() { // отпустили кнопку раньше — прыжок ниже
    if (this.jumping && this.vy < -6) this.vy = -6;
  },
  update(dt) {
    if (this.jumping) {
      this.vy += 0.8 * dt * (this.ducking ? 2.2 : 1); // duck в воздухе = быстрое приземление
      this.y += this.vy * dt;
      if (this.y >= GROUND) { this.y = GROUND; this.vy = 0; this.jumping = false; }
    }
    this.animT += dt;
    if (this.animT > 6) { this.animT = 0; this.frame ^= 1; }
  },
  hitbox() {
    // хитбокс чуть меньше спрайта — честнее к игроку
    if (this.ducking && !this.jumping)
      return { x: this.x + 6, y: this.y - this.h + 4, w: this.w - 14, h: this.h - 6 };
    return { x: this.x + 8, y: this.y - this.h + 6, w: this.w - 18, h: this.h - 10 };
  },
  draw() {
    const x = this.x;
    if (this.ducking && !this.jumping) {
      drawSprite(DINO_DUCK[this.frame], x, this.y - 8 * PX, PAL_DINO);
      return;
    }
    const legs = this.jumping ? LEGS.stand
      : (G.state === "run" ? (this.frame ? LEGS.runA : LEGS.runB) : LEGS.stand);
    drawSprite(DINO_BODY, x, this.y - 21 * PX, PAL_DINO);
    drawSprite(legs, x, this.y - 3 * PX, PAL_DINO);
  },
};

/* ---------- препятствия ---------- */
const obstacles = [];
let nextGap = 400;

function spawnObstacle() {
  const roll = Math.random();
  if (roll < 0.22 && G.score > 150) {
    // птеродактиль: три высоты — перепрыгнуть, присесть, пробежать
    const levels = [GROUND - 4, GROUND - 46, GROUND - 92];
    const y = levels[Math.floor(Math.random() * levels.length)];
    obstacles.push({ kind: "ptero", x: W + 40, y, w: 16 * PX, h: 8 * PX, frame: 0, animT: 0 });
  } else {
    // кактусы: группа из 1–3
    const sizes = [
      { w: 14, h: 30 }, { w: 20, h: 42 }, { w: 24, h: 52 },
    ];
    const s = sizes[Math.floor(Math.random() * sizes.length)];
    const count = s.h < 45 ? 1 + Math.floor(Math.random() * 3) : 1 + Math.floor(Math.random() * 2);
    let ox = W + 20;
    for (let i = 0; i < count; i++) {
      obstacles.push({ kind: "cactus", x: ox, y: GROUND, w: s.w, h: s.h + (Math.random() * 8 | 0), flower: Math.random() < 0.25 });
      ox += s.w + 4;
    }
  }
}

const CACTUS = { main: "#4e8f45", light: "#79b061", dark: "#3a7136", spine: "rgba(255,255,255,.55)", flower: "#e57fa0" };

function drawCactus(o) {
  const x = Math.round(o.x), top = Math.round(o.y - o.h), w = o.w, h = o.h;
  const stem = Math.max(8, Math.round(w * 0.44));
  const sx = x + ((w - stem) / 2 | 0);
  const armW = Math.max(5, Math.round(w * 0.3)), armH = Math.round(h * 0.3);
  // ствол с подсветкой слева и тенью справа
  ctx.fillStyle = CACTUS.main;
  ctx.fillRect(sx, top, stem, h);
  ctx.fillRect(sx + 1, top - 2, stem - 2, 2);
  ctx.fillStyle = CACTUS.light;
  ctx.fillRect(sx + 1, top, 2, h - 1);
  ctx.fillStyle = CACTUS.dark;
  ctx.fillRect(sx + stem - 2, top, 2, h - 1);
  // руки: горизонтальное плечо + вертикальный отросток
  arm(sx - armW, top + Math.round(h * 0.34), true);
  arm(sx + stem, top + Math.round(h * 0.2), false);
  function arm(ax, ay, left) {
    ctx.fillStyle = CACTUS.main;
    ctx.fillRect(ax, ay, armW + 1, 5);
    const vx = left ? ax : ax + armW - 4;
    ctx.fillRect(vx, ay - armH, 5, armH + 5);
    ctx.fillStyle = left ? CACTUS.light : CACTUS.dark;
    ctx.fillRect(vx + (left ? 1 : 3), ay - armH + 1, 1, armH);
  }
  // колючки и иногда цветок
  ctx.fillStyle = CACTUS.spine;
  for (let yy = top + 3; yy < top + h - 3; yy += 6) {
    ctx.fillRect(sx - 1, yy, 1, 2);
    ctx.fillRect(sx + stem, yy + 3, 1, 2);
  }
  if (o.flower) {
    ctx.fillStyle = CACTUS.flower;
    ctx.fillRect(sx + (stem >> 1) - 1, top - 5, 4, 3);
  }
}

function drawObstacle(o) {
  if (o.kind === "cactus") drawCactus(o);
  else drawSprite(PTERO_FRAMES[o.frame], o.x, o.y - 9 * PX + 3, PAL_PTERO);
}

function updateObstacles(dt) {
  nextGap -= G.speed * dt;
  if (nextGap <= 0) {
    spawnObstacle();
    // дистанция растёт вместе со скоростью, чтобы всегда было проходимо
    const base = 260 + G.speed * 18;
    nextGap = base + Math.random() * 260;
  }
  for (const o of obstacles) {
    o.x -= G.speed * dt;
    if (o.kind === "ptero") {
      o.animT += dt;
      if (o.animT > 8) { o.animT = 0; o.frame ^= 1; }
      o.x -= 0.8 * dt; // птицы чуть быстрее ленты
    }
  }
  while (obstacles.length && obstacles[0].x + obstacles[0].w * 2 < 0) obstacles.shift();
  for (const o of obstacles) drawObstacle(o);
}

function collides() {
  const d = dino.hitbox();
  for (const o of obstacles) {
    let box;
    if (o.kind === "cactus") box = { x: o.x + 2, y: o.y - o.h + 2, w: o.w - 4, h: o.h - 2 };
    else box = { x: o.x + 6, y: o.y - 6 * PX, w: o.w - 12, h: 4 * PX };
    if (d.x < box.x + box.w && d.x + d.w > box.x && d.y < box.y + box.h && d.y + d.h > box.y) return true;
  }
  return false;
}

/* ---------- фон: небо, барханы, песок, облака, звёзды ---------- */
let groundOffset = 0;
const bumps = Array.from({ length: 40 }, () => ({ x: Math.random() * W, w: 6 + Math.random() * 20 }));
const clouds = Array.from({ length: 4 }, (_, i) => ({ x: Math.random() * W, y: 40 + Math.random() * 90, s: 0.55 + Math.random() * 0.5 }));
const stars = Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: 10 + Math.random() * 140, r: Math.random() < 0.3 ? 2 : 1 }));
const HILL_SPAN = W + 300;
const hillsFar = Array.from({ length: 7 }, (_, i) => ({ x: i * 170 + Math.random() * 80, w: 150 + Math.random() * 130, h: 14 + Math.random() * 18 }));
const hillsNear = Array.from({ length: 5 }, (_, i) => ({ x: i * 240 + Math.random() * 100, w: 190 + Math.random() * 140, h: 8 + Math.random() * 10 }));
let farOff = 0, nearOff = 0;

function lerp(a, b, t) { return a + (b - a) * t; }
function mix(c1, c2, t) {
  return `rgb(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))})`;
}
const SKY_DAY_TOP = [154, 206, 235], SKY_NIGHT_TOP = [13, 17, 38];
const SKY_DAY_BOT = [233, 244, 248], SKY_NIGHT_BOT = [42, 50, 86];
const DAY_FG = [90, 84, 70], NIGHT_FG = [235, 235, 240];

function drawSky(n) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND + 2);
  g.addColorStop(0, mix(SKY_DAY_TOP, SKY_NIGHT_TOP, n));
  g.addColorStop(1, mix(SKY_DAY_BOT, SKY_NIGHT_BOT, n));
  ctx.fillStyle = g;
  ctx.fillRect(-10, -10, W + 20, GROUND + 14);
  if (n < 0.97) { // солнце
    ctx.globalAlpha = 1 - n;
    ctx.fillStyle = "rgba(255,236,160,.35)";
    ctx.beginPath(); ctx.arc(W - 130, 62, 30, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,232,140,.95)";
    ctx.beginPath(); ctx.arc(W - 130, 62, 20, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawScenery(dt) {
  // облака
  ctx.fillStyle = "rgba(255,255,255,.85)";
  for (const c of clouds) {
    if (G.state === "run") c.x -= G.speed * 0.25 * c.s * dt;
    if (c.x < -80) { c.x = W + 60; c.y = 40 + Math.random() * 90; }
    ctx.fillRect(c.x, c.y, 52 * c.s, 8);
    ctx.fillRect(c.x + 10 * c.s, c.y - 6, 26 * c.s, 6);
  }
  // барханы (параллакс)
  if (G.state === "run") {
    farOff = (farOff + G.speed * 0.12 * dt) % HILL_SPAN;
    nearOff = (nearOff + G.speed * 0.28 * dt) % HILL_SPAN;
  }
  hills(hillsFar, farOff, "#d3c5a2");
  hills(hillsNear, nearOff, "#c4b088");
  // песок
  ctx.fillStyle = "#dcc9a0";
  ctx.fillRect(-10, GROUND + 2, W + 20, H - GROUND + 10);
  ctx.fillStyle = "#a99676";
  ctx.fillRect(-10, GROUND + 2, W + 20, 2);
  if (G.state === "run") groundOffset = (groundOffset + G.speed * dt) % W;
  for (const b of bumps) {
    let x = b.x - groundOffset;
    if (x < -30) x += W;
    ctx.fillStyle = b.w % 2 ? "#b8a47c" : "#94825f";
    ctx.fillRect(Math.round(x), GROUND + 10 + (b.w % 3) * 4, b.w, 2);
  }
  function hills(list, off, color) {
    ctx.fillStyle = color;
    for (const hill of list) {
      const x = ((hill.x - off) % HILL_SPAN + HILL_SPAN) % HILL_SPAN - 150;
      ctx.beginPath();
      ctx.ellipse(x, GROUND + 2, hill.w / 2, hill.h, 0, Math.PI, 0);
      ctx.fill();
    }
  }
}

function drawNightSky(n) {
  if (n < 0.02) return;
  ctx.globalAlpha = n;
  ctx.fillStyle = "#e8e8f0";
  for (const s of stars) ctx.fillRect(s.x, s.y, s.r, s.r);
  // луна-серп
  ctx.beginPath(); ctx.arc(W - 130, 60, 22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = mix(SKY_DAY_TOP, SKY_NIGHT_TOP, n);
  ctx.beginPath(); ctx.arc(W - 122, 54, 20, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------- счёт ---------- */
function drawScore(fg) {
  ctx.fillStyle = fg;
  ctx.font = "bold 18px 'Courier New', monospace";
  ctx.textAlign = "right";
  const s = String(Math.floor(G.score)).padStart(5, "0");
  const hi = String(Math.floor(G.hi)).padStart(5, "0");
  if (G.milestoneFlash > 0) {
    G.milestoneFlash--;
    if ((G.milestoneFlash / 6 | 0) % 2 === 0) ctx.fillText(s, W - 20, 32);
  } else {
    ctx.fillText(s, W - 20, 32);
  }
  ctx.globalAlpha = 0.6;
  ctx.fillText("HI " + hi, W - 120, 32);
  ctx.globalAlpha = 1;
}

/* ---------- главный цикл ---------- */
let lastTime = 0;
let nowTs = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = ts;
  const dtMs = Math.min(ts - lastTime, 50);
  lastTime = ts;
  frame(dtMs, ts);
}
function frame(dtMs, ts) {
  nowTs = ts;
  const dt = dtMs / (1000 / 60); // 1 = один кадр при 60fps

  if (G.state === "pause") return;

  // день/ночь
  if (G.state === "run") {
    G.cycleTimer += dtMs;
    if (G.cycleTimer >= 25000) { G.isNight = !G.isNight; G.cycleTimer = 0; }
  }
  const target = G.isNight ? 1 : 0;
  G.nightAmount += (target - G.nightAmount) * Math.min(1, dtMs / 900);

  const bg = mix(SKY_DAY_BOT, SKY_NIGHT_BOT, G.nightAmount);
  const fg = mix(DAY_FG, NIGHT_FG, G.nightAmount);
  document.documentElement.style.setProperty("--bg", bg);
  document.documentElement.style.setProperty("--fg", fg);

  // логика
  if (G.state === "run") {
    const prevScore = G.score;
    G.score += 0.15 * dt;
    G.speed = Math.min(13, G.speed + 0.0006 * dtMs);
    if (Math.floor(G.score / 100) > Math.floor(prevScore / 100)) {
      G.milestoneFlash = 40;
      sound.milestone();
    }
    dino.update(dt);
  }

  // отрисовка
  ctx.save();
  if (G.shake > 0) {
    G.shake -= dt;
    ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
  }
  drawSky(G.nightAmount);
  drawScenery(dt);
  if (G.state === "run") {
    updateObstacles(dt);
    if (collides()) gameOver();
  } else {
    // статичная отрисовка препятствий (после смерти)
    for (const o of obstacles) drawObstacle(o);
  }
  dino.draw();
  // ночь затемняет всю сцену
  if (G.nightAmount > 0.01) {
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = mix([255, 255, 255], [118, 124, 168], G.nightAmount);
    ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.globalCompositeOperation = "source-over";
  }
  drawNightSky(G.nightAmount);
  drawScore(fg);
  if (G.state === "idle") {
    ctx.fillStyle = fg;
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(ts / 350);
    ctx.fillText("НАЖМИ, ЧТОБЫ НАЧАТЬ", W / 2, H / 2 - 20);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
requestAnimationFrame(loop);

/* ---------- состояния ---------- */
function startRun() {
  G.state = "run";
  G.score = 0;
  G.speed = 6;
  G.cycleTimer = 0;
  G.isNight = false;
  G.newRecord = false;
  obstacles.length = 0;
  nextGap = 500;
  dino.y = GROUND; dino.vy = 0; dino.jumping = false; dino.ducking = false;
  panelOver.classList.remove("show");
}

function gameOver() {
  G.state = "over";
  G.shake = 10;
  sound.hit();
  if (G.score > G.hi) {
    G.hi = G.score;
    G.newRecord = true;
    storage.save(Math.floor(G.hi));
  }
  overScore.textContent = `СЧЁТ ${Math.floor(G.score)}  ·  РЕКОРД ${Math.floor(G.hi)}`;
  overRecord.style.display = G.newRecord ? "" : "none";
  setTimeout(() => panelOver.classList.add("show"), 350);
}

function togglePause() {
  if (G.state === "run") {
    G.state = "pause";
    panelPause.classList.add("show");
  } else if (G.state === "pause") {
    G.state = "run";
    lastTime = 0;
    panelPause.classList.remove("show");
  }
}

/* ---------- ввод ---------- */
const panelOver = document.getElementById("panelOver");
const panelPause = document.getElementById("panelPause");
const overScore = document.getElementById("overScore");
const overRecord = document.getElementById("overRecord");
const btnMute = document.getElementById("btnMute");
btnMute.textContent = sound.muted ? "🔇" : "🔊";

function pressJump() {
  sound.ensure();
  if (G.state === "idle") { startRun(); dino.jump(); }
  else if (G.state === "run") dino.jump();
  else if (G.state === "over" && panelOver.classList.contains("show")) startRun();
}

addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (["Space", "ArrowUp", "KeyW"].includes(e.code)) { e.preventDefault(); pressJump(); }
  else if (["ArrowDown", "KeyS"].includes(e.code)) { e.preventDefault(); if (G.state === "run") dino.ducking = true; }
  else if (e.code === "KeyP") togglePause();
  else if (e.code === "KeyM") toggleMute();
});
addEventListener("keyup", (e) => {
  if (["Space", "ArrowUp", "KeyW"].includes(e.code)) dino.cutJump();
  else if (["ArrowDown", "KeyS"].includes(e.code)) dino.ducking = false;
});

/* тач/мышь: тап по верхним 2/3 — прыжок, по нижней трети — присесть */
let duckPointer = null;
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  sound.ensure();
  const rect = cv.getBoundingClientRect();
  const yFrac = (e.clientY - rect.top) / rect.height;
  if (G.state === "run" && yFrac > 0.72 && e.pointerType !== "mouse") {
    dino.ducking = true;
    duckPointer = e.pointerId;
  } else {
    pressJump();
  }
});
addEventListener("pointerup", (e) => {
  if (e.pointerId === duckPointer) { dino.ducking = false; duckPointer = null; }
  else dino.cutJump();
});

document.getElementById("btnRestart").addEventListener("click", (e) => { e.stopPropagation(); startRun(); });
function toggleMute() {
  sound.muted = !sound.muted;
  storage.saveMute(sound.muted);
  btnMute.textContent = sound.muted ? "🔇" : "🔊";
}
btnMute.addEventListener("click", (e) => { e.stopPropagation(); toggleMute(); });

/* debug: #demo — автостарт, #night — сразу ночь, #ff600 — промотать N кадров */
if (location.hash.includes("demo")) {
  startRun();
  G.score = 320; // чтобы появлялись птеродактили
  if (location.hash.includes("night")) { G.isNight = true; G.nightAmount = 1; }
  if (location.hash.includes("duck")) dino.ducking = true;
  const ff = /ff(\d+)/.exec(location.hash);
  if (ff) for (let i = 0; i < +ff[1]; i++) frame(16.7, i * 16.7);
}

/* автопауза при сворачивании */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && G.state === "run") togglePause();
});
</script>
